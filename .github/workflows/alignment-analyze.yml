name: Alignment Memory Analyze

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jobId:
        description: Existing Initial Sync job ID
        required: true
        type: string

permissions: {}

concurrency:
  group: >-
    alignment-analysis-${{ github.repository }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || format('repository-{0}', github.ref)
    }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event_name != 'pull_request' || (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.pull_request.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted worker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install trusted worker dependencies
        run: uv sync --frozen --group dev

      - name: Analyze allowlisted event data
        env:
          ALIGNMENT_API_BASE_URL: ${{ vars.ALIGNMENT_API_BASE_URL }}
          ALIGNMENT_REPOSITORY_ID: ${{ vars.ALIGNMENT_REPOSITORY_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_JOB_ID: ${{ github.event.inputs.jobId }}
          INTERNAL_HMAC_SECRET: ${{ secrets.INTERNAL_HMAC_SECRET }}
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FALLBACK_MODEL: ${{ vars.OPENAI_FALLBACK_MODEL }}
          OPENAI_PRIMARY_MODEL: ${{ vars.OPENAI_PRIMARY_MODEL || 'gpt-4.1-mini' }}
        run: >-
          uv run python -m alignment_memory.interfaces.worker.cli
          analyze-event --event-path "$GITHUB_EVENT_PATH"
          --output artifacts/analysis.json

      - name: Upload validated analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: alignment-analysis-${{ github.run_id }}
          path: artifacts/analysis.json
          if-no-files-found: error
          retention-days: 1
